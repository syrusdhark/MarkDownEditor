
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumina MD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Hide scrollbars for a cleaner iPad look but allow scrolling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.4);
        }
        
        /* Specialized Visual Editor Styling */
        .prose-editable {
            outline: none;
            width: 100%;
        }
        
        /* Force standard markers in editable mode for better UX */
        .prose-editable ul {
            list-style-type: disc !important;
            padding-left: 2rem !important;
            margin-top: 1rem !important;
            margin-bottom: 1rem !important;
        }
        .prose-editable ol {
            list-style-type: decimal !important;
            padding-left: 2rem !important;
            margin-top: 1rem !important;
            margin-bottom: 1rem !important;
        }
        .prose-editable li {
            display: list-item !important;
            margin-bottom: 0.5rem !important;
            padding-left: 0.5rem !important;
        }
        
        /* Fix for Tailwind Typography hiding native markers in contentEditable */
        .prose-editable ul > li::before, 
        .prose-editable ol > li::before {
            display: none !important;
        }

        .prose-editable h1 {
            font-size: 3rem !important;
            font-weight: 900 !important;
            margin-top: 2.5rem !important;
            margin-bottom: 1.5rem !important;
            line-height: 1.1 !important;
            color: #0f172a !important;
            letter-spacing: -0.025em !important;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }
        .prose-editable h2 {
            font-size: 2.25rem !important;
            font-weight: 800 !important;
            margin-top: 2rem !important;
            margin-bottom: 1rem !important;
            line-height: 1.2 !important;
            color: #1e293b !important;
            letter-spacing: -0.025em !important;
        }
        .prose-editable p {
            margin-bottom: 1.5rem !important;
            line-height: 1.8 !important;
            font-size: 1.125rem !important;
            color: #334155 !important;
        }
        .prose-editable blockquote {
            border-left: 4px solid #8b5cf6 !important;
            background: #f5f3ff !important;
            padding: 1.5rem 2rem !important;
            border-radius: 0 1rem 1rem 0 !important;
            font-style: italic !important;
            margin: 2rem 0 !important;
        }

        /* Table Styling for Visual Editor */
        .prose-editable table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            border: 1px solid #e2e8f0;
        }
        .prose-editable th, .prose-editable td {
            border: 1px solid #e2e8f0;
            padding: 0.75rem 1rem;
            text-align: left;
        }
        .prose-editable th {
            background-color: #f8fafc;
            font-weight: 700;
        }

        /* Horizontal Rule Style */
        .prose-editable hr {
            border: 0;
            border-top: 2px solid #e2e8f0;
            margin: 3rem 0;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .prose-editable hr:hover {
            border-color: #cbd5e1;
        }

        /* Mermaid Block Styling in Visual Editor */
        .prose-editable pre.mermaid {
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            padding: 1.5rem;
            border-radius: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            margin: 2rem 0;
            white-space: pre-wrap;
            position: relative;
        }
        .prose-editable pre.mermaid::before {
            content: 'FLOWCHART (MERMAID)';
            position: absolute;
            top: -10px;
            left: 20px;
            background: #64748b;
            color: white;
            font-size: 9px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        /* Focus states for blocks */
        .prose-editable *:focus {
            outline: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "remark-gfm": "https://esm.sh/remark-gfm@^4.0.1",
    "react-syntax-highlighter/": "https://esm.sh/react-syntax-highlighter@^16.1.0/",
    "react-syntax-highlighter": "https://esm.sh/react-syntax-highlighter@^16.1.0",
    "marked": "https://esm.sh/marked@^15.0.0",
    "turndown": "https://esm.sh/turndown@^7.2.0",
    "turndown-plugin-gfm": "https://esm.sh/turndown-plugin-gfm@^1.0.2",
    "mermaid": "https://esm.sh/mermaid@^11.4.0"
  }
}
</script>
</head>
<body class="h-full bg-slate-50 text-slate-900 overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
